<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web calculator App level 1</title>
</head>
<body>
    <div class ="page-container">
        <img src ="asstes/logo/wsa-logo.svg" alt ="WSA logo">
 

  <section Class = "calculator -section - container">
    <!-- background-circle-->
     <div class="bg circle">

    <!--Main Calculator-->
    <div class ="container">
        <h1>CALCULATOR</h1>

        <!--display -->
<div>
<input type ="text" id="input"
class ="secondary-input" disabled>
<br>
<input type="text" id="screen"
class="primary-input" disabled>
    </div>

    <!--1st row-->
    <div class="row">
<button  class="btn btn -primary">C</button>
<button  class="btn btn -primary">
    <img src="./asstes/icons/delete.svg" 
    width="10px" height="10px">
</button>
<button  class="btn btn -primary">%</button>
<button  class="btn btn -primary">÷</button>
    </div>

        <!--2nd row-->
    <div class="row">
        <button class="btn">7</button>
        <button class="btn">8</button>
        <button class="btn">9</button>
        <button class="btn">×</button>
    </div>

        <!--3rd row-->
    <div class="row">
        <button class="btn">4</button>
        <button class="btn">5</button>
        <button class="btn">6</button>
        <button class="btn">+</button>
    </div>

        <!--4th row-->
    <div class="row">
        <button class="btn">1</button>
        <button class="btn">2</button>
        <button class="btn">3</button>
        <button class="btn">−</button>
    </div>

        <!--5th row-->
    <div class="row">
        <button class="btn btn-expanded">0</button>
        <button class="btn">.</button>
        <button class="equal-btn" id="eval">=</button>
     </div>

    </div>
</div>
     
    
</section>

<!--Footer -->
<p Class="copyright-text">&copy; 2025 WSA. All Rights
    Reserved</p>

</div>
</body>
</html>
