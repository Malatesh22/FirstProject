<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Blog</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      color: #666666;
    }
    header {
      background-color: #9c2659;
      color: #ffffff;
      padding: 20px 0;
      text-align: center;
    }

    nav {
      background-color: #82224b;
      text-align: center;
      padding: 10px 0;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    main {
      max-width: 800px;
      margin: 20px auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 5px;
    }

    h1 {
      color: #333333;
    }

    article {
      margin-bottom: 30px;
    }

    article h2 {
      color: #333333;
    }

    footer {
      background-color: #9c2659;
      color: #ffffff;
      text-align: center;
      padding: 15px 0;
      position: relative;
      bottom: 0;
      width: 100%;
    }
</style>
</head>
<body>

  <header>
    <h1>My Simple Blog</h1>
    <p>Sharing thoughts, ideas, and stories.</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Posts</a>
    <a href="#">Contact</a>
  </nav>
